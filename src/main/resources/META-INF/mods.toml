modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="voidbornrpg"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''
Mod RPG de combate cinemático avanzado para Minecraft Forge 26.3.
Incluye armas y armaduras 3D con GeckoLib, animaciones de jugador con PlayerAnimator,
sistema de Maná/Cooldowns en servidor, habilidades definitivas y partículas físicas.
'''

[[dependencies.voidbornrpg]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.voidbornrpg]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.voidbornrpg]]
    modId="geckolib"
    mandatory=true
    versionRange="[4.5,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.voidbornrpg]]
    modId="playeranimator"
    mandatory=true
    versionRange="[2.0,)"
    ordering="AFTER"
    side="CLIENT"
